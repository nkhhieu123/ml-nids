[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nids"
version = "0.1.0"
description = "Phát hiện tấn công mạng dựa trên lưu lượng mạng bằng học máy"
readme = "README.md"
requires-python = ">=3.10"
# Chỉ các thư viện mã chính thực sự dùng (C12-T06). Bộ đọc gói và bắt gói là mã tự viết, không cần Scapy (QĐ-088).
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "networkx>=3.2",
    "PyYAML>=6.0",
    "joblib>=1.3",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
notebook = ["jupyter>=1.0", "nbconvert>=7.0", "nbformat>=5.0"]
hoc_sau = ["lightgbm>=4.0", "torch>=2.2"]                 # nids.hoc_sau (docs/82)
so_sanh = ["scapy>=2.5", "dpkt>=1.9", "pyshark>=0.6"]     # nids.so_sanh_bo_doc (docs/11 mục 6)

[tool.setuptools.packages.find]
where = ["src"]
