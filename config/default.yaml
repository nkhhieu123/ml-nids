# Cấu hình chung của hệ thống. Huấn luyện và realtime đọc cùng file này.
# Tên module và tập nhãn không nằm ở đây mà ở src/nids/scope.py.

capture:
  interface: eth0            # giao diện giám sát trên Kali, chỉnh theo lab
  pcap_dir: data/pcap

# Cửa sổ ban đầu; chỉnh trên tập validation rồi giữ cố định khi kiểm thử.
windows:
  flow:                      # đặc trưng flow/host
    size_s: 10
    step_s: 2
  graph:                     # đặc trưng beaconing/đồ thị
    size_s: 120
    step_s: 10

flow:
  idle_timeout_s: 60         # tạm thời, xem QĐ-006
  active_timeout_s: 120      # flow dài hơn thì cắt, phần sau là flow tiếp nối; QĐ-017
  close_grace_s: 10          # sau FIN hai chiều/RST còn nhận gói cuối trong khoảng này; QĐ-017
  direction_memory_s: 3600   # nhớ chiều của flow đã kết thúc để flow sau giữ chiều; QĐ-017
  fragment_timeout_s: 30     # nhớ mảnh IP đầu để gắn các mảnh sau vào flow, xem QĐ-016
  handshake_observe_s: 3     # chờ trả lời bắt tay TCP trước khi coi là không hoàn tất; QĐ-023, tạm thời

labeling:
  schedule: config/label_schedule.csv   # lịch tấn công: nguồn nhãn (QĐ-025)
  tolerance_s: 60            # nới khung giờ tấn công mỗi đầu; lịch CIC khớp dữ liệu tới phút
  window_min_attack_share: 0.2  # cửa sổ có phần flow tấn công thấp hơn mức này là mơ hồ (QĐ-026)

split:                       # chia theo thời gian trong từng khối tấn công và khoảng bình thường (QĐ-027)
  train: 0.6
  validation: 0.2
  test: 0.2
  embargo_s: 10              # bỏ mẫu cách ranh giới giữa hai tập dưới khoảng này (bằng độ dài cửa sổ)

preprocess:                  # chỉ fit và cân bằng trên train (QĐ-028)
  drop_train_duplicates: true  # module phân loại: bỏ mẫu train trùng hệt đặc trưng và nhãn (docs/30 mục 5)
  balance_max_ratio: 10      # giảm mẫu mỗi lớp xuống tối đa 10 lần lớp ít nhất
  sessions:                  # phiên dùng cho từng module (QĐ-009, docs/08)
    attack_classification: [cic17_wednesday, cic17_friday]
    anomaly: [cic17_monday, cic17_wednesday, cic17_friday]
  anomaly_fit_sessions: [cic17_monday]   # bộ tiền xử lý chung `anomaly` fit trên normal phiên này; Gaussian dùng biến đổi riêng và chọn phiên fit ở mục gaussian (QĐ-032)

gaussian:                    # Gaussian phát hiện bất thường trên cửa sổ host (Chặng 6)
  covariance: ledoit_wolf    # co hiệp phương sai về đường chéo; luôn nghịch đảo được (QĐ-031)
  fit_session_candidates:    # các cách lấy normal của train để fit; chọn theo F1 trên validation (QĐ-032)
    - [cic17_monday]         # chỉ phiên không có tấn công
    - null                   # normal của train mọi phiên
  threshold: f1_on_dinh      # F1 tốt nhất khi ngưỡng lệch ±20% (QĐ-032); f1: F1 lớn nhất; fpr: báo động giả <= target_fpr
  threshold_band: 1.2
  target_fpr: 0.01

classifier:                  # phân loại tấn công đa lớp trên cửa sổ host (Chặng 7, QĐ-033)
  logistic_regression:       # mô hình đối chiếu (C07-T02); tham số chốt trên validation ở C07-T04
    C: 1.0
    class_weight: balanced
  random_forest:             # C07-T03; tham số chốt trên validation ở C07-T04
    n_estimators: 300
    max_depth: null          # null: cây mọc tới khi lá thuần hoặc chạm min_samples_leaf
    min_samples_leaf: 1
    max_features: sqrt
    class_weight: balanced_subsample
  search:                    # C07-T04, theo macro-F1 validation (QĐ-035)
    balance_max_ratio: [10, 100, null]   # bước 1: tỷ lệ giảm mẫu train × class_weight; null: không giảm
    logistic_regression:
      class_weight: [balanced, null]
      C: [0.01, 0.1, 1.0, 10.0, 100.0]   # bước 2
    random_forest:
      class_weight: [balanced_subsample, null]
      max_depth: [null, 20, 10]          # bước 2
      min_samples_leaf: [1, 3, 10]
      max_features: [sqrt, 0.5]

botnet:                      # module botnet/topology (Chặng 8); cửa sổ đồ thị ở windows.graph
  ctu13_dir: data/ctu13      # file .binetflow gốc
  flows_dir: output/ctu13    # flow đã lọc theo host cần xét (python -m nids.ctu13 chuan-bi)
  background_sample: 20      # số host Background lấy mẫu mỗi scenario, chỉ để ước lượng báo động (QĐ-036)
  local_nets: [147.32.0.0/16, 192.168.50.0/24]   # mạng nội bộ của CTU-13 và lab; dùng cho ty_le_peer_noi_bo (QĐ-037)
  beaconing:                 # C08-T03 (QĐ-038)
    lookback_s: 600          # nhìn ngược từ cuối cửa sổ; 120 giây với 5 quan sát chỉ thấy chu kỳ <= 30 giây
    min_observations: 5      # ít hơn số lần bắt đầu flow này thì cặp không đủ quan sát, không tính
    max_cv: 0.3              # CV khoảng cách <= mức này là đều (cho phép jitter khoảng ±30%)
    min_period_s: 1.0        # khoảng cách trung bình nhỏ hơn là dồn dập (tấn công), không phải beacon
  splits:                    # chia theo scenario CTU-13 (B11, QĐ-039); validation tạm chọn, đổi được
    train: [3, 5, 7, 10, 11, 12]
    validation: [4, 13]
    test: [1, 2, 6, 8, 9]
  topology:                  # nhãn topology của bot theo scenario; còn lại là centralized (docs/07 mục 5)
    p2p: [12]
  max_background_alarm: 0.05 # chọn ngưỡng và tham số: tỷ lệ cửa sổ Background validation bị báo không quá mức này (QĐ-040)
  topology_rule:             # nhận diện topology bằng quy tắc, chạy sau bộ phát hiện (C08-T07, QĐ-042)
    min_peer_vao: 5          # p2p khi đồng thời: >= 5 peer gọi vào host,
    min_udp: 0.5             # >= 50% flow là UDP,
    min_entropy_vao: 0.8     # và flow vào chia đều giữa các peer; còn lại là centralized

pipeline:                    # pipeline offline (Chặng 9); đường dẫn tương đối tính từ thư mục dự án
  models:                    # mô hình của từng module (mặc định trong paths.model_dir)
    anomaly: models/gaussian_windows.joblib
    attack_classification: models/phan_loai_rf_windows.joblib
    botnet_topology: models/botnet_rf.joblib

lab:
  subnet: 192.168.50.0/24
  hosts:
    192.168.50.10: Máy giám sát Kali Linux
    192.168.50.20: Máy thử nghiệm
    192.168.50.30: Máy chủ dịch vụ
    192.168.50.41: Client/Bot mô phỏng 1
    192.168.50.42: Client/Bot mô phỏng 2
    192.168.50.43: Client/Bot mô phỏng 3
    192.168.50.50: Server điều phối mô phỏng

paths:
  data_dir: data
  model_dir: models
  output_dir: output
  run_log_dir: data/run_logs  # nhật ký lần chạy, cơ sở gán nhãn

alerts:
  channels: [terminal, csv]  # bản đầu tiên chưa có dashboard
  csv_path: output/alerts.csv
  log_all: false             # true: lưu cả dự đoán bình thường vào CSV

random_seed: 42
